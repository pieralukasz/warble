<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Warble pill</title>
  <style>
    /* One dark capsule that changes content with the dictation phase, like the
       macOS pill: a live level meter while listening, dots while transcribing,
       a check when the text is typed. */
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
    .pill { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 16px; border-radius: 20px;
            background: rgba(28, 32, 31, 0.92); color: #fff; font-size: 13px; font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.14); max-width: 220px; }
    .bars { display: flex; align-items: center; gap: 3px; height: 20px; }
    .bars span { width: 3px; height: 4px; border-radius: 2px; background: #6fd0a8; transition: height 60ms linear; }
    .dots span { display: inline-block; width: 6px; height: 6px; margin: 0 2px; border-radius: 3px; background: #fff; opacity: .35; animation: pulse 1s infinite; }
    .dots span:nth-child(2) { animation-delay: .15s; }
    .dots span:nth-child(3) { animation-delay: .3s; }
    @keyframes pulse { 50% { opacity: 1; } }
    .msg { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .error { color: #ffb4ab; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="pill" role="status" aria-live="polite">
    <div class="bars" id="bars" hidden></div>
    <div class="dots" id="dots" hidden><span></span><span></span><span></span></div>
    <span class="msg" id="msg"></span>
  </div>
  <script src="pill.js"></script>
</body>
</html>

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  app:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        run: swift test

      - name: Release build and bundle
        run: |
          swift build -c release
          scripts/bundle-app.sh .build/release/warble .build/Warble.app ci
          plutil -lint .build/Warble.app/Contents/Info.plist

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run types:check
      - run: bun run build

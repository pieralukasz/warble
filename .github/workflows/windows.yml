name: Windows

on:
  push:
    branches: [main, warble]
    paths: ["windows/**", ".github/workflows/windows.yml"]
    tags: ["windows-v*"]
  pull_request:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows

      - name: Unit tests
        run: cargo test --locked

      - uses: oven-sh/setup-bun@v2

      - name: Build warble.exe and the installer
        run: bunx @tauri-apps/cli@2 build --ci

      - name: Cache the speech model
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\io.github.pieralukasz.warble\models
          key: parakeet-tdt-0.6b-v3-int8-8f23f0c

      # warble.exe is a windowed program: PowerShell only waits for it when
      # its output is piped, hence `| Out-Host`.
      - name: Download the model (verifies SHA-256)
        shell: pwsh
        run: |
          .\target\release\warble.exe download-model | Out-Host
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Transcribe a Polish sample end to end
        shell: pwsh
        run: |
          $text = .\target\release\warble.exe transcribe tests\fixtures\polish-sample.wav | Out-String
          Write-Host "Transcript: $text"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if ($text -notmatch "dobry" -or $text -notmatch "komputerze" -or $text -notmatch "Windows") {
            Write-Error "Unexpected transcript"
            exit 1
          }

      - name: Doctor (no microphone on CI, so only printed)
        run: .\target\release\warble.exe doctor | Out-Host; exit 0
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: warble-windows
          path: |
            windows/target/release/warble.exe
            windows/target/release/bundle/nsis/*.exe

      - name: Publish a release for windows-v* tags
        if: startsWith(github.ref, 'refs/tags/windows-v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: |
            windows/target/release/warble.exe
            windows/target/release/bundle/nsis/*.exe
